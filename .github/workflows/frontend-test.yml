name: frontend-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Same major as frontend/Dockerfile's build stage.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins, and fails if it
      # disagrees with package.json.
      - name: npm ci
        run: npm ci

      # Same cutoff as sbom.yml's grype scan.
      - name: npm audit
        run: npm audit --audit-level=high

      # vue-tsc type-checks before vite builds (see package.json).
      - name: build
        run: npm run build
