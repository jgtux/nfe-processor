name: backend-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # golang:1.22-alpine matches backend/Dockerfile's own build stage.
    # Needed for real: the XSD validator (lestrrat-go/libxml2, a cgo
    # binding) is incompatible with newer libxml2 releases shipped by
    # non-Alpine distros/runners -- Alpine's older libxml2 is what this
    # project is actually built and tested against.
    container: golang:1.22-alpine
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: apk add --no-cache git libxml2-dev gcc musl-dev

      - name: go test
        run: CGO_ENABLED=1 go test ./... -v -race

      # Pinned to v1.1.4, the last govulncheck whose go.mod accepts Go 1.22
      # (v1.2.0+ need 1.25, and this image builds with its own toolchain).
      # The vulnerability database is fetched live, so the pin doesn't make
      # the results stale. Expect stdlib findings while the build stays on
      # 1.22, which is past end of life: that's the signal, not noise.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: CGO_ENABLED=1 "$(go env GOPATH)/bin/govulncheck" ./...
